components:
  schemas:
    BathroomTypeEnum:
      enum:
      - attached
      - shared
      type: string
      description: |-
        * `attached` - Attached
        * `shared` - Shared
    BlankEnum:
      enum:
      - ''
    CategoryEnum:
      enum:
      - legal
      - construction
      - finance
      - marketing
      type: string
      description: |-
        * `legal` - Legal & Documentation
        * `construction` - Construction & Repair
        * `finance` - Financial Services
        * `marketing` - Marketing & Photography
    ChatRoom:
      type: object
      properties:
        RoomID:
          type: string
          format: uuid
          readOnly: true
        PropertyID:
          type: string
          format: uuid
          readOnly: true
        PropertyTitle:
          type: string
          readOnly: true
        Participants:
          type: array
          items:
            $ref: '#/components/schemas/ChatUser'
          readOnly: true
        LastMessage:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - LastMessage
      - Participants
      - PropertyID
      - PropertyTitle
      - RoomID
      - created_at
      - updated_at
    ChatUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - email
      - id
      - role
    DocTypeEnum:
      enum:
      - deed
      - tax
      - utility
      - ownership
      type: string
      description: |-
        * `deed` - Title Deed
        * `tax` - Property Tax Receipt
        * `utility` - Utility Bill
        * `ownership` - Ownership Certificate
    DocumentTypeEnum:
      enum:
      - nid
      - passport
      - license
      type: string
      description: |-
        * `nid` - National ID
        * `passport` - Passport
        * `license` - Driver License
    HostelGenderEnum:
      enum:
      - boys
      - girls
      - mixed
      type: string
      description: |-
        * `boys` - Boys Only
        * `girls` - Girls Only
        * `mixed` - Mixed / Co-ed
    KycStatusEnum:
      enum:
      - pending
      - verified
      - rejected
      - not_submitted
      type: string
      description: |-
        * `pending` - Pending
        * `verified` - Verified
        * `rejected` - Rejected
        * `not_submitted` - Not Submitted
    ListingTypeEnum:
      enum:
      - sale
      - rent
      type: string
      description: |-
        * `sale` - Sale
        * `rent` - Rent
    Loan:
      type: object
      properties:
        LoanID:
          type: string
          format: uuid
          readOnly: true
        UserID:
          type: integer
          readOnly: true
        PropertyID:
          type: string
          format: uuid
        LoanAmount:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        InterestRate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        LoanStatus:
          type: string
          readOnly: true
        ApplicationDate:
          type: string
          format: date-time
          readOnly: true
        ApprovalDate:
          type: string
          format: date-time
          readOnly: true
        Age:
          type: integer
        CreditScore:
          type: integer
        LoanTerm:
          type: integer
      required:
      - ApplicationDate
      - ApprovalDate
      - InterestRate
      - LoanAmount
      - LoanID
      - LoanStatus
      - PropertyID
      - UserID
    Message:
      type: object
      properties:
        MessageID:
          type: string
          format: uuid
          readOnly: true
        SenderID:
          type: integer
          readOnly: true
        RoomID:
          type: string
          format: uuid
        MessageText:
          type: string
        Timestamp:
          type: string
          format: date-time
          readOnly: true
        Status:
          type: string
          readOnly: true
      required:
      - MessageID
      - MessageText
      - RoomID
      - SenderID
      - Status
      - Timestamp
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        type:
          $ref: '#/components/schemas/TypeEnum'
        title:
          type: string
          maxLength: 255
        message:
          type: string
        is_read:
          type: boolean
        link:
          type: string
          nullable: true
          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - message
      - title
    NullEnum:
      enum:
      - null
    PatchedChatRoom:
      type: object
      properties:
        RoomID:
          type: string
          format: uuid
          readOnly: true
        PropertyID:
          type: string
          format: uuid
          readOnly: true
        PropertyTitle:
          type: string
          readOnly: true
        Participants:
          type: array
          items:
            $ref: '#/components/schemas/ChatUser'
          readOnly: true
        LastMessage:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedLoan:
      type: object
      properties:
        LoanID:
          type: string
          format: uuid
          readOnly: true
        UserID:
          type: integer
          readOnly: true
        PropertyID:
          type: string
          format: uuid
        LoanAmount:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        InterestRate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        LoanStatus:
          type: string
          readOnly: true
        ApplicationDate:
          type: string
          format: date-time
          readOnly: true
        ApprovalDate:
          type: string
          format: date-time
          readOnly: true
        Age:
          type: integer
        CreditScore:
          type: integer
        LoanTerm:
          type: integer
    PatchedMessage:
      type: object
      properties:
        MessageID:
          type: string
          format: uuid
          readOnly: true
        SenderID:
          type: integer
          readOnly: true
        RoomID:
          type: string
          format: uuid
        MessageText:
          type: string
        Timestamp:
          type: string
          format: date-time
          readOnly: true
        Status:
          type: string
          readOnly: true
    PatchedNotification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        type:
          $ref: '#/components/schemas/TypeEnum'
        title:
          type: string
          maxLength: 255
        message:
          type: string
        is_read:
          type: boolean
        link:
          type: string
          nullable: true
          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedProperty:
      type: object
      properties:
        PropertyID:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        location:
          type: string
          maxLength: 255
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        property_type:
          $ref: '#/components/schemas/PropertyTypeEnum'
        OwnerID:
          type: integer
          readOnly: true
        seller_id:
          type: integer
          readOnly: true
        CreatedAt:
          type: string
          format: date-time
          readOnly: true
        listing_type:
          $ref: '#/components/schemas/ListingTypeEnum'
        beds:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        baths:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        area_sqft:
          type: number
          format: double
          nullable: true
        status:
          $ref: '#/components/schemas/PropertyStatusEnum'
        is_verified:
          type: boolean
        property_images:
          type: array
          items:
